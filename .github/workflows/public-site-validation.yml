name: Public site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  public-site:
    name: Public site contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/liberty-mutual-public-site
    env:
      SITECORE_EDGE_CONTEXT_ID: ${{ secrets.SITECORE_SERVER_EDGE_CONTEXT_ID }}
      SITECORE_LIVE_EDGE_CONTEXT_ID: ${{ secrets.SITECORE_SERVER_EDGE_CONTEXT_ID }}
      SITECORE_EDITING_SECRET: ${{ secrets.SITECORE_EDITING_SECRET }}
      NEXT_PUBLIC_SITECORE_EDGE_CONTEXT_ID: ${{ vars.SITECORE_PUBLIC_EDGE_CONTEXT_ID }}
      NEXT_PUBLIC_DEFAULT_SITE_NAME: liberty-mutual-public-site
      NEXT_PUBLIC_DEFAULT_LANGUAGE: en
      NEXT_PUBLIC_SITE_URL: https://liberty-mutual-public-site.vercel.app
      PUBLIC_SITE_URL: https://liberty-mutual-public-site.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/liberty-mutual-public-site/.nvmrc
          cache: npm
          cache-dependency-path: examples/liberty-mutual-public-site/package-lock.json
      - run: npm ci
      - name: Validate publication authorization, receipts, and Search reconciliation
        run: npm run test:publication
      - name: Validate isolated Redis health checks
        run: npm run test:health
      - name: Validate consent-based scroll measurement boundaries
        run: npm run test:analytics
      - name: Validate product, ZIP, and internal journey context
        run: npm run test:journey
      - name: Verify natural-language search query handling
        run: npm run test:search
      - name: Validate authored JSON-LD HTML boundaries
        run: npm run test:structured-data
      - name: Validate native configuration and preservation contracts
        working-directory: .
        run: node --test authoring/scripts/public-*.test.cjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: authoring/scripts/requirements.txt
      - name: Validate generated native content and presentation source
        working-directory: .
        run: |
          python -m pip install -r authoring/scripts/requirements.txt
          python authoring/scripts/public-build-model.py --check
          python authoring/scripts/public-build-portal-relevance.py --check
          python authoring/scripts/public-prepare-fidelity.test.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate public and portal-relevance serialization modules
        working-directory: .
        run: |
          dotnet tool restore
          dotnet sitecore ser validate -i 'LibertyMutual.Public*' -i 'LibertyMutual.PortalRelevance*'
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      - name: Lint application
        run: npm run lint
      - name: Require published delivery contexts
        run: |
          if [ -z "$SITECORE_EDGE_CONTEXT_ID" ] || [ -z "$SITECORE_LIVE_EDGE_CONTEXT_ID" ] || [ -z "$NEXT_PUBLIC_SITECORE_EDGE_CONTEXT_ID" ] || [ -z "$SITECORE_EDITING_SECRET" ]; then
            echo '::error::Configure the private server context, scoped public browser context, and editing signing secret before the connected build.'
            exit 1
          fi
      - name: Generate real SDK maps and metadata
        run: |
          npm run sitecore-tools:generate-map
          npm run sitecore-tools:build
      - name: Typecheck complete application
        run: npm run type-check
      - name: Build and scan emitted browser assets
        run: npm run build
      - name: Record verification scope
        run: |
          echo 'Production compilation and contract checks passed against published Sitecore content. Runtime publication, Redis, native authoring, and visitor journeys are verified separately against the deployed site.' >> "$GITHUB_STEP_SUMMARY"
