name: Portal validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  offline-validation:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/liberty-mutual-agent-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/liberty-mutual-agent-portal/.nvmrc
          cache: npm
          cache-dependency-path: examples/liberty-mutual-agent-portal/package-lock.json
      - run: npm ci
      - name: Validate local setup safeguards
        run: npm run test:setup
      - name: Lint application
        run: npm run lint
      - name: Authentication, identity readiness, durable state, isolation, and resource routing tests
        run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: authoring/scripts/requirements.txt
      - name: Validate content and identity contracts without tenant credentials
        working-directory: .
        run: |
          python -m pip install -r authoring/scripts/requirements.txt
          python authoring/scripts/build-resource-taxonomy-seed.py --check
          python authoring/scripts/build-resource-page-seed.py --check
          python authoring/scripts/build-campaign-seed.py --check
          python authoring/scripts/validate-content-seed.py
      - name: Validate placement migration and preservation safeguards
        working-directory: .
        run: node --test authoring/scripts/portal-placeholder-layouts.test.cjs authoring/scripts/configure-portal-placeholders.test.cjs
      - name: Validate resource creation and local image authoring safeguards
        working-directory: .
        run: node --test authoring/scripts/configure-resource-page-authoring.test.cjs
      - name: Validate campaign composition and scoped scheduling safeguards
        working-directory: .
        run: |
          node --test authoring/scripts/campaign-authoring.test.cjs authoring/scripts/schedule-campaign-publication.test.cjs
          node authoring/personalization/verify-small-business-growth-opportunity.cjs
      - name: Validate editable content deployment safeguards
        working-directory: .
        run: node --test authoring/scripts/deploy-content.test.cjs
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Validate owned Sitecore serialization modules
        working-directory: .
        run: |
          dotnet tool restore
          dotnet sitecore ser validate -i LibertyMutual.Model -i LibertyMutual.Content -i LibertyMutual.SitePresentation -i LibertyMutual.Taxonomy -i LibertyMutual.ResourcePageBranch -i LibertyMutual.CampaignPageBranch
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'

  connected-build:
    name: Connected production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/liberty-mutual-agent-portal
    env:
      # Edge is a private resource. Keep server delivery access in a repository secret.
      SITECORE_EDGE_CONTEXT_ID: ${{ secrets.SITECORE_SERVER_EDGE_CONTEXT_ID }}
      NEXT_PUBLIC_SITECORE_EDGE_CONTEXT_ID: ${{ vars.SITECORE_PUBLIC_EDGE_CONTEXT_ID }}
      NEXT_PUBLIC_SITECORE_EDGE_PLATFORM_HOSTNAME: ${{ vars.SITECORE_EDGE_PLATFORM_HOSTNAME || 'https://edge-platform.sitecorecloud.io' }}
      NEXT_PUBLIC_DEFAULT_SITE_NAME: liberty-mutual-agent-portal
      NEXT_PUBLIC_DEFAULT_LANGUAGE: en
      NEXT_PUBLIC_PORTAL_TRACKING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require published delivery context
        run: |
          if [ -z "$SITECORE_EDGE_CONTEXT_ID" ] || [ -z "$NEXT_PUBLIC_SITECORE_EDGE_CONTEXT_ID" ]; then
            echo '::error::Configure secret SITECORE_SERVER_EDGE_CONTEXT_ID for scoped Live delivery and variable SITECORE_PUBLIC_EDGE_CONTEXT_ID for the scoped browser context. Offline checks cannot certify a production build.'
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/liberty-mutual-agent-portal/.nvmrc
          cache: npm
          cache-dependency-path: examples/liberty-mutual-agent-portal/package-lock.json
      - run: npm ci
      - name: Generate real Sitecore SDK files
        run: |
          npm run sitecore-tools:generate-map
          npm run sitecore-tools:build
      - name: Typecheck complete application
        run: npm run type-check
      - name: Build for production
        run: npm run build
      - name: Record verification scope
        run: |
          echo 'Production compilation passed against published Sitecore content. This check does not deploy, publish CMS content, or verify runtime Redis, login, search, personalization, or campaign behavior.' >> "$GITHUB_STEP_SUMMARY"
