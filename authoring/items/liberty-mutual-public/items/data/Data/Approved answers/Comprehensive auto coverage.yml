    - ID: 54e5a9a7-a8e8-54f9-b163-f6cf04fe0119
      Hint: answer
      Value: Comprehensive coverage can help with damage to your vehicle from events other than a collision, such as theft, vandalism, hail, or a falling tree. The coverage you select, your deductible, and your policy terms determine how a covered loss is handled.
    - ID: 47041dc1-a183-5516-85ea-afdea936289c
      Hint: formalWording
      Value: <p>Comprehensive coverage is subject to the applicable deductible, coverage limits, exclusions, and policy conditions. A lender may require it for a financed or leased vehicle.</p>
    - ID: db533ede-0a22-5a9b-ae03-f3298cfc2e70
      Hint: explanation
      Value: <p>Think about the risks to your car beyond a crash. Review the coverage and deductible in your quote or policy, and ask about anything unclear. This overview cannot confirm whether a particular incident is covered.</p>
