      Hint: answer
      Value: General insurance information cannot determine whether your specific loss is covered. The cause of the damage, your selected coverages, policy limits, exclusions, and conditions all matter. Review your policy contract, and contact your insurer or agent for help with your situation.
    - ID: 47041dc1-a183-5516-85ea-afdea936289c
      Hint: formalWording
      Value: <p>Coverage for a specific loss is determined from the applicable policy and the facts of the loss. This general overview is not a coverage decision or a promise of payment.</p>
