      Hint: question
      Value: What should I review when choosing auto insurance in Illinois?
    - ID: 54e5a9a7-a8e8-54f9-b163-f6cf04fe0119
      Hint: answer
      Value: Use Illinois-specific guidance when comparing car insurance. Review liability and uninsured motorist bodily injury coverage, and consider the protection you want for your own vehicle. The state minimum is a starting point for a conversation about your needs.
    - ID: 47041dc1-a183-5516-85ea-afdea936289c
      Hint: formalWording
      Value: <p>Illinois coverage requirements and the policy terms apply. General information does not replace a review of your limits, deductibles, selected coverages, and individual circumstances.</p>
    - ID: db533ede-0a22-5a9b-ae03-f3298cfc2e70
      Hint: explanation
      Value: "<p>Compare quotes with equivalent limits and deductibles. The Illinois Department of Insurance shopping guide explains required and optional coverages, and an independent agent can help you discuss the choices that fit your vehicle and budget.</p><ul><li><a href=\"https://idoi.illinois.gov/consumers/consumerinsurance/auto-insurance-shopping-guide.html\" target=\"_blank\" rel=\"noopener noreferrer\">Illinois Department of Insurance: Auto Insurance Shopping Guide</a></li></ul>"
