      Hint: question
      Value: What should I compare when shopping for car insurance?
    - ID: 54e5a9a7-a8e8-54f9-b163-f6cf04fe0119
      Hint: answer
      Value: Compare similar coverage limits, deductibles, and optional protections when reviewing car insurance quotes. Price matters, but so does the protection you choose. Your location, driving history, vehicle, and selected coverages can affect the quote.
    - ID: 47041dc1-a183-5516-85ea-afdea936289c
      Hint: formalWording
      Value: <p>Quoted premiums depend on individual rating information and selected coverage. Comparing unlike limits or deductibles does not provide an equivalent coverage comparison.</p>
    - ID: db533ede-0a22-5a9b-ae03-f3298cfc2e70
      Hint: explanation
      Value: <p>Start with your coverage needs. Review liability limits, collision and comprehensive deductibles, and any optional coverage you want. Then compare quotes on the same basis, and ask an agent about differences you do not understand.</p>
