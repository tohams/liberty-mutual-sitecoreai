      Hint: question
      Value: What should I review when choosing auto insurance in Florida?
    - ID: 54e5a9a7-a8e8-54f9-b163-f6cf04fe0119
      Hint: answer
      Value: Florida has its own auto insurance requirements and coverage considerations. Review Personal Injury Protection and Property Damage Liability, along with optional protection for your vehicle and other risks. An agent can help you consider coverage beyond the state minimum.
    - ID: 47041dc1-a183-5516-85ea-afdea936289c
      Hint: formalWording
      Value: <p>This is general Florida information, not a determination of the coverage required for an individual driver or the protection provided by a particular policy.</p>
    - ID: db533ede-0a22-5a9b-ae03-f3298cfc2e70
      Hint: explanation
      Value: <p>Start with the Florida-specific overview instead of assuming guidance from another state applies. Review your quote and policy carefully, and ask about limits, deductibles, exclusions, and coverage that fits how you use your vehicle.</p>
