    - ID: db533ede-0a22-5a9b-ae03-f3298cfc2e70
      Hint: explanation
      Value: <h2>Read your policy documents</h2><p>Start with the coverages you selected and the limits and deductibles that apply. Review the exclusions and conditions, along with the declarations page.</p><h2>Look at how the damage happened</h2><p>Water damage can have different causes. A sudden plumbing leak, a maintenance issue, and flooding can involve different policy terms. Keep the details of the damage available when you speak with your insurer.</p><h2>Ask about your next step</h2><p>Your insurer can help you understand your policy and explain how to report a claim. Your agent can help you review your policy and discuss your situation.</p>
