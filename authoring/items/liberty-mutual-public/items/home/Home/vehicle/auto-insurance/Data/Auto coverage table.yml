      Value: <p>Review the role of different coverages. Coverage, terms, and availability depend on your policy and state.</p><table><thead><tr><th scope="col">Coverage type</th><th scope="col">How it can help</th></tr></thead><tbody><tr><th scope="row"><a href="https://www.libertymutual.com/vehicle/auto-insurance/coverage/bodily-injury-liability">Bodily Injury Liability</a></th><td>Can help with injury-related costs for which you are responsible after an accident.</td></tr><tr><th scope="row"><a href="https://www.libertymutual.com/vehicle/auto-insurance/coverage/property-damage-coverage">Property Damage Liability</a></th><td>Can help pay for damage to someone else’s property for which you are responsible.</td></tr><tr><th scope="row"><a href="/insurance-resources/comprehensive-auto-coverage">Comprehensive</a></th><td>Can help with covered damage from events other than a collision, subject to your deductible.</td></tr><tr><th scope="row"><a href="/insurance-resources/collision-coverage-and-deductibles">Collision</a></th><td>Can help with covered collision damage to your vehicle, subject to your deductible.</td></tr></tbody></table>
