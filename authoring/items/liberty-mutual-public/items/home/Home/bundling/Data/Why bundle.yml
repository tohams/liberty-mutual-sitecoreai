      Value: <h2>Why bundle auto and home insurance?</h2><p>Here are just a few reasons why it can help to bundle your insurance.</p>
    - ID: 2bdf3765-4d4d-54af-879e-96a83b50893e
      Hint: body
      Value: <h3>Save money</h3><p>A home and auto insurance bundle is the easiest way to save money on your insurance. If you need auto insurance and home, renters, or condo insurance, you could save hundreds a year just by bundling!</p><h3>It&#x27;s more convenient</h3><p>At Liberty Mutual, when you bundle home and auto insurance you can manage both of your policies in one place, to</p> <ul><li>View and download policy documents, like ID cards<sup>2</sup></li><li>Securely pay and manage bills</li><li>File, manage, and track claims</li><li>Review coverages and make policy changes 24/7</li></ul><h3>Flexibility</h3><p>A home and auto insurance bundle lets you manage your insurance anywhere, no need to call an agent or go to an office. Plus, with Liberty Mutual, you can access your policies with our easy-to-use app.</p>
