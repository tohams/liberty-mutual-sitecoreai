    - ID: "e4144560-576a-559b-9110-b56e9a58a338"
      Hint: body
      Value: "<h2>Start with what you know</h2><p>Your client relationships can help you understand how a business operates. Begin with discovery, then bring the right information to the commercial conversation.</p><h2>A practical three-step path</h2><ol><li><strong>Understand the business.</strong> Review common BOP considerations and the role of workers compensation and commercial auto.</li><li><strong>Check the context.</strong> Explore guidance for the risk state and business type.</li><li><strong>Prepare the request.</strong> Use the submission checklist and ask your relationship team about unresolved questions.</li></ol><p>Choose one next action for your agency: complete the learning path, review a resource with a teammate, or prepare an appetite inquiry.</p>"
