      Hint: body
      Value: <h2>Begin with the business</h2><p>A businessowners policy brings property and general liability coverages together. Workers compensation and commercial auto should be considered separately; review the applicable policy terms and underwriting guidance.</p><h2>Prepare the account</h2><ul><li>Confirm the legal name, ownership and risk locations.</li><li>Describe the operations in plain language, including services, customers and changes.</li><li>Gather property details, annual sales, payroll and prior coverage information as requested.</li><li>Identify unanswered questions before submitting for review.</li></ul><h2>Choose a clear next step</h2><p>Use the appetite finder for the selected state and business type, then prepare the request. Submission is a request for review and does not bind coverage.</p>
