      Hint: body
      Value: |
        <h2>Industry and entity structure matter</h2><p>Florida requirements vary by industry, employee count and entity organization. Construction employers generally need coverage with one or more employees; non-construction employers generally need coverage with four or more. Agricultural employers have separate thresholds.</p><h2>Review the details</h2><p>Owner treatment, exemptions, out-of-state work and contractor obligations need careful review. Use the Florida Department of Financial Services guidance to check the full requirements for the employer's circumstances.</p><p>This educational summary does not replace the official guidance or determine Liberty Mutual underwriting eligibility.</p><p><a href="https://www.myfloridacfo.com/division/wc/employer/coverage-requirements">Read Florida coverage requirements</a></p>
