    - ID: "0adad3c2-48c4-59db-9e15-02c7f816e86c"
      Hint: body
      Value: <h2>Use the right parties and terms</h2><ul><li>Confirm the principal's legal name.</li><li>Identify the obligee and the underlying obligation.</li><li>Record the requested bond type, amount and required date.</li><li>Include the required form and supporting documents.</li><li>Make any rider, consent or renewal request explicit.</li></ul><p>Keep questions and requirements together in the request timeline. A submitted request is pending review and does not issue a bond.</p>
