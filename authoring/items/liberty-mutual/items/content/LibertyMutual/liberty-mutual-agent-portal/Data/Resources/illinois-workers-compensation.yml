    - ID: "0adad3c2-48c4-59db-9e15-02c7f816e86c"
      Hint: body
      Value: |
        <h2>Review coverage from the first employee</h2><p>The Illinois Workers' Compensation Commission explains that an employer with one employee, including a part-time employee, generally must obtain workers compensation insurance. Rare statutory exceptions apply.</p><h2>Keep the circumstances in view</h2><p>Entity owners may have particular opt-out provisions, and some extra-hazardous occupations require further review. Consult the Commission's insurance guidance and the applicable law rather than assuming that an ownership title creates an exemption.</p><p>This is educational content and does not determine an employer's legal obligations or Liberty Mutual underwriting eligibility.</p><p><a href="https://iwcc.illinois.gov/about/insurance.html">Read Illinois insurance guidance</a></p>
