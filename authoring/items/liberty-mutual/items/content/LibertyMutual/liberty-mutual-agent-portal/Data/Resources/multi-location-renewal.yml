    - ID: "0adad3c2-48c4-59db-9e15-02c7f816e86c"
      Hint: body
      Value: "<h2>Build one reliable account view</h2><p>Confirm the location schedule, business activities and changes since the last review. Use consistent names and dates across the package.</p><ul><li>Reconcile the location schedule with the account overview.</li><li>Assign each outstanding requirement.</li><li>Summarize material changes in a short cover note.</li><li>Separate coverage questions from missing-document tasks.</li><li>Agree the next review milestone with the account team.</li></ul><p>Keep specialist questions connected to the case so the next person can continue the work with context.</p>"
