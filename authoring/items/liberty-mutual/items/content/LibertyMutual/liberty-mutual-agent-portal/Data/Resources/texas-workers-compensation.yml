    - ID: "0adad3c2-48c4-59db-9e15-02c7f816e86c"
      Hint: body
      Value: |
        <h2>Begin with the employer and the work</h2><p>Texas does not require workers compensation coverage for most private employers. Private employers contracting with government entities must provide coverage for employees working on the project. Contracts may also require subcontractors or independent contractors to carry coverage.</p><h2>Check the source before advising</h2><p>Coverage choices have consequences beyond the premium. Review the Texas Department of Insurance guide for the employer's situation, including obligations that may apply when an employer does not provide workers compensation.</p><p>This is an educational starting point. It does not determine legal obligations or Liberty Mutual underwriting eligibility.</p><p><a href="https://www.tdi.texas.gov/pubs/consumer/cb030.html">Read the Texas Department of Insurance guide</a></p>
